<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEMKO — Admin</title>
<style>
  :root {
    --gold: #F5B800;
    --bg: #0A0A0A;
    --surface: #111111;
    --surface2: #1A1A1A;
    --border: #222;
    --text: #E8E8E8;
    --text-dim: #888;
    --green: #22c55e;
    --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }

  /* Layout */
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 0; }
  .main { margin-left: 220px; padding: 32px; min-height: 100vh; }

  /* Sidebar */
  .logo { padding: 0 20px 28px; border-bottom: 1px solid var(--border); }
  .logo span { font-size: 18px; font-weight: 800; letter-spacing: 2px; color: var(--gold); }
  .logo small { display: block; font-size: 10px; letter-spacing: 1.5px; color: var(--text-dim); text-transform: uppercase; margin-top: 2px; }
  nav { padding: 16px 0; flex: 1; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: var(--text-dim); text-decoration: none; font-size: 13px; font-weight: 500; transition: all 0.15s; border-left: 2px solid transparent; }
  nav a:hover, nav a.active { color: var(--text); background: var(--surface2); border-left-color: var(--gold); }
  nav a svg { width: 16px; height: 16px; flex-shrink: 0; }
  .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); }

  /* Header */
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  .page-title { font-size: 22px; font-weight: 700; }
  .page-subtitle { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

  /* Stats cards */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .stat-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
  .stat-value { font-size: 32px; font-weight: 800; color: var(--gold); }
  .stat-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  /* Table */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .table-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--border); }
  .table-title { font-weight: 600; font-size: 15px; }
  .table-actions { display: flex; gap: 8px; }
  .btn { padding: 7px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: #444; }
  .btn-gold { background: var(--gold); color: #000; }
  .btn-gold:hover { opacity: 0.9; }

  table { width: 100%; border-collapse: collapse; }
  th { padding: 10px 16px; text-align: left; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); background: var(--surface2); border-bottom: 1px solid var(--border); font-weight: 600; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-gold { background: rgba(245,184,0,0.15); color: var(--gold); }
  .badge-green { background: rgba(34,197,94,0.12); color: var(--green); }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; font-size: 11px; color: var(--text-dim); }

  .empty { text-align: center; padding: 48px; color: var(--text-dim); }
  .empty svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: 0.3; }

  .tab-bar { display: flex; gap: 2px; margin-bottom: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px; width: fit-content; }
  .tab { padding: 7px 18px; border-radius: 5px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-dim); border: none; background: transparent; transition: all 0.15s; }
  .tab.active { background: var(--surface2); color: var(--text); }

  .search-wrap { position: relative; }
  .search-wrap input { padding: 7px 12px 7px 32px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; width: 220px; outline: none; }
  .search-wrap input:focus { border-color: #444; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-dim); }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 8px; padding: 12px 18px; font-size: 13px; z-index: 1000; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }

  #loading { display: flex; align-items: center; justify-content: center; padding: 48px; gap: 10px; color: var(--text-dim); }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <span>JEMKO</span>
    <small>Panel Admin</small>
  </div>
  <nav>
    <a href="#" class="active" onclick="showTab('dashboard'); return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="#" onclick="showTab('contacts'); return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Leads / Contactos
    </a>
    <a href="#" onclick="showTab('newsletter'); return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l7 5 7-5"/><rect x="4" y="6" width="16" height="12" rx="2"/></svg>
      Newsletter
    </a>
  </nav>
  <div class="sidebar-footer">JEMKO Backend v1.0</div>
</div>

<main class="main">

  <!-- DASHBOARD -->
  <div id="tab-dashboard">
    <div class="page-header">
      <div>
        <div class="page-title">Dashboard</div>
        <div class="page-subtitle">Resumen general de actividad</div>
      </div>
      <button class="btn btn-ghost" onclick="loadAll()">↻ Actualizar</button>
    </div>
    <div class="stats" id="stats">
      <div id="loading"><div class="spinner"></div> Cargando...</div>
    </div>
    <div class="table-wrap">
      <div class="table-header">
        <div class="table-title">Últimos leads</div>
      </div>
      <div id="recent-contacts"></div>
    </div>
  </div>

  <!-- CONTACTS -->
  <div id="tab-contacts" style="display:none">
    <div class="page-header">
      <div>
        <div class="page-title">Leads / Contactos</div>
        <div class="page-subtitle" id="contacts-count">—</div>
      </div>
      <div class="table-actions">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Buscar..." oninput="filterContacts(this.value)" id="contact-search">
        </div>
        <button class="btn btn-gold" onclick="exportCSV('contacts')">Exportar CSV</button>
      </div>
    </div>
    <div class="table-wrap">
      <div id="contacts-table"></div>
    </div>
  </div>

  <!-- NEWSLETTER -->
  <div id="tab-newsletter" style="display:none">
    <div class="page-header">
      <div>
        <div class="page-title">Suscriptores Newsletter</div>
        <div class="page-subtitle" id="subs-count">—</div>
      </div>
      <div class="table-actions">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Buscar email..." oninput="filterSubs(this.value)" id="sub-search">
        </div>
        <button class="btn btn-gold" onclick="exportCSV('subscribers')">Exportar CSV</button>
      </div>
    </div>
    <div class="table-wrap">
      <div id="subs-table"></div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
let allContacts = [];
let allSubs     = [];

// ─── Nav ─────────────────────────────────────────────────────────────────────
function showTab(name) {
  ['dashboard','contacts','newsletter'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t === name ? '' : 'none';
  });
  document.querySelectorAll('nav a').forEach((a,i) => {
    a.classList.toggle('active', i === ['dashboard','contacts','newsletter'].indexOf(name));
  });
}

// ─── Toast ───────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ─── Fetch data ───────────────────────────────────────────────────────────────
async function loadAll() {
  try {
    const [c, s] = await Promise.all([
      fetch('/api/admin/contacts').then(r => r.json()),
      fetch('/api/admin/subscribers').then(r => r.json()),
    ]);
    allContacts = c;
    allSubs     = s;
    renderDashboard();
    renderContacts(allContacts);
    renderSubs(allSubs);
  } catch(e) {
    document.getElementById('stats').innerHTML = '<div style="color:#ef4444;padding:20px">Error al cargar datos. Verificá que el servidor esté corriendo.</div>';
  }
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function renderDashboard() {
  const today = new Date().toISOString().slice(0,10);
  const todayContacts = allContacts.filter(c => c.created_at.startsWith(today)).length;
  const todaySubs     = allSubs.filter(s => s.created_at.startsWith(today)).length;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Total Leads</div>
      <div class="stat-value">${allContacts.length}</div>
      <div class="stat-sub">+${todayContacts} hoy</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Suscriptores</div>
      <div class="stat-value">${allSubs.length}</div>
      <div class="stat-sub">+${todaySubs} hoy</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Último lead</div>
      <div class="stat-value" style="font-size:16px;margin-top:6px">${allContacts[0]?.nombre || '—'}</div>
      <div class="stat-sub">${allContacts[0]?.created_at?.slice(0,16).replace('T',' ') || '—'}</div>
    </div>
  `;

  const recent = allContacts.slice(0, 8);
  document.getElementById('recent-contacts').innerHTML = recent.length
    ? renderContactsTable(recent)
    : '<div class="empty"><div>Sin leads todavía</div></div>';
}

// ─── Contacts table ───────────────────────────────────────────────────────────
function renderContactsTable(data) {
  return `
  <table>
    <thead><tr>
      <th>Nombre</th><th>Empresa</th><th>Email</th><th>WhatsApp</th><th>Intereses</th><th>Fecha</th>
    </tr></thead>
    <tbody>
    ${data.map(c => `
      <tr>
        <td><strong>${esc(c.nombre)}</strong></td>
        <td>${esc(c.empresa||'—')}</td>
        <td><a href="mailto:${esc(c.email)}" style="color:var(--gold)">${esc(c.email)}</a></td>
        <td>${c.whatsapp ? `<a href="https://wa.me/${c.whatsapp.replace(/\D/g,'')}" style="color:var(--gold)" target="_blank">${esc(c.whatsapp)}</a>` : '—'}</td>
        <td>
          <div class="chips">
            ${(c.intereses||'').split(',').filter(Boolean).map(i => `<span class="chip">${esc(i.trim())}</span>`).join('')||'—'}
          </div>
        </td>
        <td style="white-space:nowrap;color:var(--text-dim)">${(c.created_at||'').slice(0,16).replace('T',' ')}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderContacts(data) {
  document.getElementById('contacts-count').textContent = `${data.length} lead${data.length !== 1 ? 's' : ''}`;
  document.getElementById('contacts-table').innerHTML = data.length
    ? renderContactsTable(data)
    : '<div class="empty">Sin leads todavía</div>';
}

function filterContacts(q) {
  const filtered = allContacts.filter(c =>
    [c.nombre, c.empresa, c.email, c.whatsapp, c.intereses, c.mensaje]
      .some(f => (f||'').toLowerCase().includes(q.toLowerCase()))
  );
  renderContacts(filtered);
}

// ─── Subscribers table ────────────────────────────────────────────────────────
function renderSubsTable(data) {
  return `
  <table>
    <thead><tr><th>#</th><th>Email</th><th>Fecha</th></tr></thead>
    <tbody>
    ${data.map((s,i) => `
      <tr>
        <td style="color:var(--text-dim)">${i+1}</td>
        <td><a href="mailto:${esc(s.email)}" style="color:var(--gold)">${esc(s.email)}</a></td>
        <td style="color:var(--text-dim)">${(s.created_at||'').slice(0,16).replace('T',' ')}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderSubs(data) {
  document.getElementById('subs-count').textContent = `${data.length} suscriptor${data.length !== 1 ? 'es' : ''}`;
  document.getElementById('subs-table').innerHTML = data.length
    ? renderSubsTable(data)
    : '<div class="empty">Sin suscriptores todavía</div>';
}

function filterSubs(q) {
  const filtered = allSubs.filter(s => (s.email||'').toLowerCase().includes(q.toLowerCase()));
  renderSubs(filtered);
}

// ─── Export CSV ───────────────────────────────────────────────────────────────
function exportCSV(type) {
  const data   = type === 'contacts' ? allContacts : allSubs;
  if (!data.length) { toast('No hay datos para exportar.'); return; }

  const headers = type === 'contacts'
    ? ['ID','Nombre','Empresa','Email','WhatsApp','Intereses','Mensaje','Fecha']
    : ['ID','Email','Fecha'];

  const rows = data.map(r => type === 'contacts'
    ? [r.id, r.nombre, r.empresa||'', r.email, r.whatsapp||'', r.intereses||'', r.mensaje||'', r.created_at]
    : [r.id, r.email, r.created_at]
  );

  const csv = [headers, ...rows]
    .map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','))
    .join('\n');

  const blob = new Blob(['﻿'+csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `jemko_${type}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exportado correctamente.');
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
